# 三平台打包。
# - 推 v* 標籤（例如 v0.2.0）：打包並建立草稿 Release，確認後在 GitHub 上按發布。
# - 手動執行（Actions → build → Run workflow）：只打包，安裝檔放在這次執行的 Artifacts。
name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ''
          - name: macos-arm64
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          # ONNX Runtime 沒有 Intel Mac 的預編譯檔 → 不含 Kokoro 語音
          - name: macos-x64
            os: macos-latest
            args: '--target x86_64-apple-darwin -- --no-default-features'
            test: '--target x86_64-apple-darwin --no-default-features'
          # ONNX Runtime 的預編譯檔需要 glibc 2.38 以上
          - name: linux-x64
            os: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 相依套件
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      # 離線字典一起打包進安裝檔（依 dict-manifest.json 下載並驗證檢查碼）
      - name: 下載離線字典
        run: node tools/fetch-dict.mjs

      # Tauri 的巨集編譯時要讀前端檔案（dist、gen-overlay）
      - run: npm run build:web

      - name: 測試
        run: cargo test --manifest-path src-tauri/Cargo.toml ${{ matrix.test || matrix.args }}

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'book-en ${{ github.ref_name }}'
          releaseBody: '安裝檔見下方 Assets。第一次開啟若沒有離線字典，App 會詢問是否下載。'
          releaseDraft: true

      - name: 上傳安裝檔（手動執行時）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: book-en-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
